name: TeamCity Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  COMPOSE_FILE: infrastructure/docker_compose/docker-compose.yml
  TEAMCITY_URL: http://localhost:8111
  # TeamCity as seen from the browser container, which joins teamcity-network
  UIBASEURL: http://teamcity-server:8111

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    # Each entry provisions its own TeamCity stack, so all suites run in parallel
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            tests: 'api/**/*Test.java'
            browser: chrome
            browserVersion: '128.0'
          - name: ui-chrome
            tests: 'ui/**/*Test.java'
            browser: chrome
            browserVersion: '128.0'
          - name: ui-firefox
            tests: 'ui/**/*Test.java'
            browser: firefox
            browserVersion: '125.0'
          - name: ui-opera
            tests: 'ui/**/*Test.java'
            browser: opera
            browserVersion: '109.0'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Start TeamCity environment
        run: |
          docker compose -f "$COMPOSE_FILE" up -d
          docker pull selenoid/vnc_chrome:128.0

      - name: Pull browser image
        if: matrix.browser != 'chrome'
        run: docker pull "selenoid/vnc:${{ matrix.browser }}_${{ matrix.browserVersion }}"

      - name: Wait for TeamCity HTTP server
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$TEAMCITY_URL/mnt" || true)
            echo "Attempt $i/60: status=$status"
            [ "$status" = "200" ] && exit 0
            sleep 5
          done
          docker compose -f "$COMPOSE_FILE" logs --tail 300 teamcity-server
          exit 1

      # Super User token is resolved lazily from the container log (superuser.token=auto),
      # because TeamCity regenerates it when the server leaves maintenance mode
      - name: Install and configure TeamCity
        env:
          BROWSER: chrome
          BROWSERVERSION: '128.0'
        run: mvn -B --no-transfer-progress test -Dgroups=precondition -DexcludedGroups=

      - name: Wait for TeamCity readiness
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$TEAMCITY_URL/healthCheck/ready" || true)
            echo "Attempt $i/60: ready=$status"
            [ "$status" = "200" ] && exit 0
            sleep 5
          done
          docker compose -f "$COMPOSE_FILE" logs --tail 300 teamcity-server
          exit 1

      - name: Run tests
        env:
          BROWSER: ${{ matrix.browser }}
          BROWSERVERSION: ${{ matrix.browserVersion }}
        run: mvn -B --no-transfer-progress test -Dtest='${{ matrix.tests }}'

      - name: Container logs
        if: failure()
        run: |
          docker compose -f "$COMPOSE_FILE" logs --tail 500 teamcity-server
          docker compose -f "$COMPOSE_FILE" logs --tail 500 teamcity-agent
          docker compose -f "$COMPOSE_FILE" logs --tail 300 selenoid

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-${{ matrix.name }}
          path: target/surefire-reports

      - name: Stop TeamCity environment
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v --remove-orphans

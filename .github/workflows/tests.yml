name: TeamCity Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  COMPOSE_FILE: infrastructure/docker_compose/docker-compose.yml
  TEAMCITY_URL: http://localhost:8111
  # TeamCity as seen from the browser container, which joins teamcity-network
  UIBASEURL: http://teamcity-server:8111

permissions:
  contents: write

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    # Each entry provisions its own TeamCity stack, so all suites run in parallel
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            tests: 'api/**/*Test.java'
            browser: chrome
            browserVersion: '128.0'
          - name: ui-chrome
            tests: 'ui/**/*Test.java'
            browser: chrome
            browserVersion: '128.0'
          - name: ui-firefox
            tests: 'ui/**/*Test.java'
            browser: firefox
            browserVersion: '125.0'
          - name: ui-opera
            tests: 'ui/**/*Test.java'
            browser: opera
            browserVersion: '109.0'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Start TeamCity environment
        run: |
          docker compose -f "$COMPOSE_FILE" up -d
          docker pull selenoid/vnc_chrome:128.0

      - name: Pull browser image
        if: matrix.browser != 'chrome'
        run: docker pull "selenoid/vnc:${{ matrix.browser }}_${{ matrix.browserVersion }}"

      - name: Wait for TeamCity HTTP server
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$TEAMCITY_URL/mnt" || true)
            echo "Attempt $i/60: status=$status"
            [ "$status" = "200" ] && exit 0
            sleep 5
          done
          docker compose -f "$COMPOSE_FILE" logs --tail 300 teamcity-server
          exit 1

      # Super User token is resolved lazily from the container log (superuser.token=auto),
      # because TeamCity regenerates it when the server leaves maintenance mode
      - name: Install and configure TeamCity
        env:
          BROWSER: chrome
          BROWSERVERSION: '128.0'
        run: mvn -B --no-transfer-progress test -Dgroups=precondition -DexcludedGroups=

      - name: Wait for TeamCity readiness
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$TEAMCITY_URL/healthCheck/ready" || true)
            echo "Attempt $i/60: ready=$status"
            [ "$status" = "200" ] && exit 0
            sleep 5
          done
          docker compose -f "$COMPOSE_FILE" logs --tail 300 teamcity-server
          exit 1

      - name: Run tests
        env:
          BROWSER: ${{ matrix.browser }}
          BROWSERVERSION: ${{ matrix.browserVersion }}
        run: |
          mvn -B --no-transfer-progress \
          test \
          -Dtest='${{ matrix.tests }}'

      - name: Container logs
        if: failure()
        run: |
          docker compose -f "$COMPOSE_FILE" \
            logs --tail 500 teamcity-server
          
          docker compose -f "$COMPOSE_FILE" \
            logs --tail 500 teamcity-agent
          
          docker compose -f "$COMPOSE_FILE" \
            logs --tail 300 selenoid

      - name: Upload Surefire results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.name }}
          path: target/surefire-reports
          if-no-files-found: warn
          retention-days: 7

      - name: Stop TeamCity environment
        if: always()
        run: |
          docker compose -f "$COMPOSE_FILE" \
            down -v --remove-orphans
  allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline
          allure --version

      - name: Restore previous Allure history
        run: |
          git fetch origin gh-pages || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            mkdir -p previous-report

            git archive origin/gh-pages | tar -x -C previous-report

            if [ -d previous-report/history ]; then
              cp -R previous-report/history allure-results/
            fi
          fi

      - name: Generate Allure report
        run: |
          allure generate allure-results \
            --clean \
            -o allure-report

      - name: Upload generated Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 7

      - name: Publish Allure report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/allure-pages
          mkdir -p /tmp/allure-pages

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git archive origin/gh-pages | tar -x -C /tmp/allure-pages
          fi

          rm -rf /tmp/allure-pages/*
          cp -R allure-report/. /tmp/allure-pages/

          cd /tmp/allure-pages

          git init
          git checkout -b gh-pages

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Update Allure report" || true

          git remote add origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          git push --force origin gh-pages
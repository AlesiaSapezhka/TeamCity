name: E2E

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: infrastructure/docker_compose/docker-compose.yml
      BROWSER_IMAGE: selenoid/vnc_chrome:128.0
      # Seen from the browser container, which joins teamcity-network
      UIBASEURL: http://teamcity-server:8111

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Start TeamCity stack
        run: |
          docker compose up -d
          docker pull "$BROWSER_IMAGE"

      - name: Wait for TeamCity
        run: |
          for _ in $(seq 1 150); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8111/mnt || true)
            [ "$code" = "200" ] && exit 0
            sleep 4
          done
          echo "TeamCity did not start"
          exit 1

      - name: Read Super User token
        run: |
          for _ in $(seq 1 60); do
            token=$(docker compose exec -T teamcity-server \
              sh -c "grep -a -i 'Super user authentication token' /opt/teamcity/logs/teamcity-server.log | tail -1" \
              | grep -oE '[0-9]{5,}' | tail -1 || true)
            if [ -n "$token" ]; then
              echo "::add-mask::$token"
              echo "SUPERUSER_TOKEN=$token" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          echo "Super User token not found"
          exit 1

      - name: Set up TeamCity (precondition)
        run: mvn -B --no-transfer-progress test -Dgroups=precondition -DexcludedGroups=

      - name: Run tests
        run: mvn -B --no-transfer-progress test

      - name: Collect server logs
        if: always()
        run: docker compose logs --no-color --tail 300 teamcity-server > teamcity-server.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            target/surefire-reports
            teamcity-server.log

      - name: Stop stack
        if: always()
        run: docker compose down -v

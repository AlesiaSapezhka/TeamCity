name: TeamCity Tests

on:
  push:

jobs:

  setup:
    name: TeamCity setup
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Clean TeamCity environment
        run: docker compose down -v --remove-orphans

      - name: Start TeamCity
        run: docker compose up -d

      - name: Show containers
        run: docker compose ps

      - name: Wait for TeamCity
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8111/healthCheck/ready; then
              echo "TeamCity is ready"
              exit 0
            fi

            echo "Waiting for TeamCity..."
            sleep 5
          done

          echo "TeamCity did not become ready"
          docker compose logs teamcity-server
          exit 1

      - name: Setup TeamCity
        run: mvn -B test -Dtest="TeamCityInstallationTest#setUpTeamCity"
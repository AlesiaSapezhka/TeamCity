# 6. Wait until TeamCity HTTP server is available
- name: Wait for TeamCity server
  run: |
    echo "Waiting for TeamCity HTTP server..."

    for i in {1..60}; do
      STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
        "$TEAMCITY_URL" || true)

      echo "Attempt $i/60: TeamCity HTTP status = $STATUS"

      if [ "$STATUS" != "000" ]; then
        echo "TeamCity HTTP server is available!"
        break
      fi

      sleep 5
    done

    if [ "$STATUS" = "000" ]; then
      echo "TeamCity HTTP server did not start"
      docker compose -f "$COMPOSE_FILE" logs --tail 300 teamcity-server
      exit 1
    fi

# 7. Run TeamCity installation and preconditions
- name: Run TeamCity preconditions
  run: |
    mvn test -Dtest=TeamCityInstallationTest

# 8. Verify TeamCity is ready after installation
- name: Verify TeamCity is ready
  run: |
    echo "Waiting for TeamCity to become ready after installation..."

    for i in {1..60}; do
      STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
        "$TEAMCITY_URL/healthCheck/ready" || true)

      echo "Attempt $i/60: TeamCity ready status = $STATUS"

      if [ "$STATUS" = "200" ]; then
        echo "TeamCity is ready!"
        break
      fi

      sleep 5
    done

    if [ "$STATUS" != "200" ]; then
      echo "TeamCity is still not ready after installation"
      docker compose -f "$COMPOSE_FILE" logs --tail 300 teamcity-server
      exit 1
    fi

# 9. Run regular tests
- name: Run tests
  run: |
    mvn clean test -DexcludedGroups=precondition
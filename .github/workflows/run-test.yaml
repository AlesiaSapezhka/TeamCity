name: TeamCity Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  COMPOSE_FILE: infrastructure/docker_compose/docker_compose.yml
  TEAMCITY_URL: http://localhost:8111

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      # 3. Clean previous Docker environment
      - name: Stop previous TeamCity environment
        run: |
          docker compose -f "$COMPOSE_FILE" down -v --remove-orphans

      # 4. Start TeamCity
      - name: Start TeamCity
        run: |
          docker compose -f "$COMPOSE_FILE" up -d

      # 5. Show containers
      - name: Check Docker containers
        run: |
          docker compose -f "$COMPOSE_FILE" ps

      # 6. Wait until TeamCity is ready
      - name: Wait for TeamCity
        run: |
          echo "Waiting for TeamCity..."

          for i in {1..60}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$TEAMCITY_URL/healthCheck/ready" || true)

            echo "Attempt $i: TeamCity status = $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "TeamCity is ready!"
              break
            fi

            sleep 5
          done

          if [ "$STATUS" != "200" ]; then
            echo "TeamCity did not become ready"
            docker compose -f "$COMPOSE_FILE" logs --tail 200 teamcity-server
            exit 1
          fi

      # 7. Run TeamCity installation / preconditions
      - name: Run TeamCity preconditions
        run: |
          mvn test \
            -Dtest=TeamCityInstallationTest

      # 8. Run regular tests
      # Preconditions are excluded from the regular test suite
      - name: Run tests
        run: |
          mvn clean test \
            -DexcludedGroups=precondition

      # 9. Show TeamCity logs if something failed
      - name: TeamCity logs
        if: failure()
        run: |
          docker compose -f "$COMPOSE_FILE" logs --tail 300 teamcity-server
          docker compose -f "$COMPOSE_FILE" logs --tail 300 teamcity-agent

      # 10. Stop Docker environment
      - name: Stop TeamCity environment
        if: always()
        run: |
          docker compose -f "$COMPOSE_FILE" down -v --remove-orphans
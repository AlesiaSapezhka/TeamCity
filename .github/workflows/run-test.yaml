name: TeamCity Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:

env:
  COMPOSE_FILE: infrastructure/docker_compose/docker-compose.yml
  TEAMCITY_URL: http://localhost:8111

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Java
      # ---------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      # ---------------------------------------------------------
      # 3. Clean previous Docker environment
      # ---------------------------------------------------------
      - name: Stop previous TeamCity environment
        run: |
          docker compose -f "$COMPOSE_FILE" down -v --remove-orphans

      # ---------------------------------------------------------
      # 4. Start TeamCity + Agent + Selenoid
      # ---------------------------------------------------------
      - name: Start TeamCity environment
        run: |
          docker compose -f "$COMPOSE_FILE" up -d

      # ---------------------------------------------------------
      # 5. Show containers
      # ---------------------------------------------------------
      - name: Check Docker containers
        run: |
          docker compose -f "$COMPOSE_FILE" ps

      # ---------------------------------------------------------
      # 6. Wait until TeamCity HTTP server is available
      #
      # IMPORTANT:
      # /healthCheck/ready must NOT be checked here.
      #
      # On a fresh TeamCity installation it returns 503 until
      # the initial setup is completed.
      # ---------------------------------------------------------
      - name: Wait for TeamCity HTTP server
        run: |
          echo "Waiting for TeamCity HTTP server..."

          STATUS="000"

          for i in {1..60}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "$TEAMCITY_URL" || true)

            echo "Attempt $i/60: TeamCity HTTP status = $STATUS"

            if [ "$STATUS" != "000" ]; then
              echo "TeamCity HTTP server is available!"
              break
            fi

            sleep 5
          done

          if [ "$STATUS" = "000" ]; then
            echo "TeamCity HTTP server did not start."

            docker compose -f "$COMPOSE_FILE" logs --tail 300 teamcity-server

            exit 1
          fi

      # ---------------------------------------------------------
      # 7. TeamCity initial installation / configuration
      #
      # This test must NOT be @Disabled.
      #
      # It should:
      # - perform initial TeamCity setup
      # - create/configure admin user
      # - configure required authentication
      # - prepare the agent
      # ---------------------------------------------------------
      - name: Install and configure TeamCity
        run: |
          mvn test -Dtest=TeamCityInstallationTest

      # ---------------------------------------------------------
      # 8. Wait until TeamCity is fully ready
      # ---------------------------------------------------------
      - name: Wait for TeamCity readiness
        run: |
          echo "Waiting for TeamCity to become ready..."

          STATUS="000"

          for i in {1..60}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "$TEAMCITY_URL/healthCheck/ready" || true)

            echo "Attempt $i/60: TeamCity ready status = $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "TeamCity is ready!"
              break
            fi

            sleep 5
          done

          if [ "$STATUS" != "200" ]; then
            echo "TeamCity is still not ready."

            docker compose -f "$COMPOSE_FILE" logs --tail 300 teamcity-server
            docker compose -f "$COMPOSE_FILE" logs --tail 300 teamcity-agent

            exit 1
          fi

      # ---------------------------------------------------------
      # 9. Run regular tests
      #
      # Preconditions are excluded because they were already
      # executed in the previous step.
      # ---------------------------------------------------------
      - name: Run automated tests
        run: |
          mvn clean test -DexcludedGroups=precondition

      # ---------------------------------------------------------
      # 10. Save TeamCity server logs if something failed
      # ---------------------------------------------------------
      - name: TeamCity server logs
        if: failure()
        run: |
          docker compose -f "$COMPOSE_FILE" logs --tail 500 teamcity-server

      # ---------------------------------------------------------
      # 11. Save TeamCity agent logs if something failed
      # ---------------------------------------------------------
      - name: TeamCity agent logs
        if: failure()
        run: |
          docker compose -f "$COMPOSE_FILE" logs --tail 500 teamcity-agent

      # ---------------------------------------------------------
      # 12. Save Selenoid logs if something failed
      # ---------------------------------------------------------
      - name: Selenoid logs
        if: failure()
        run: |
          docker compose -f "$COMPOSE_FILE" logs --tail 300 selenoid

      # ---------------------------------------------------------
      # 13. Cleanup
      # ---------------------------------------------------------
      - name: Stop TeamCity environment
        if: always()
        run: |
          docker compose -f "$COMPOSE_FILE" down -v --remove-orphans
name: Checkstyle & Parallel Automation Tests

on:
  push:
    branches: [ nikita_ci ]
  workflow_dispatch:

jobs:
  run-test-automation:
    name: Code Control & Run Parallel Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      # 1. Запуск инфраструктуры (TeamCity Server + Agent + Selenoid)
      # На сервере GitHub Actions Docker Compose установлен из коробки!
      - name: Start Test Infrastructure
        run: |
          cd infra/docker_compose
          chmod +x restart_docker.sh
          ./restart_docker.sh

      # Даем контейнерам 40 секунд, чтобы TeamCity успел сгенерировать токен в логи
      - name: Wait for Server Warmup
        run: sleep 40

      # 2. УСТАНОВКА ALLURE CLI НА СЕРВЕР GITHUB ACTIONS
      # Скачиваем официальный Linux-бинарник, распаковываем и прописываем в систему
      - name: Install Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://github.com
          sudo tar -zxf allure-2.27.0.tgz -C /opt/
          sudo ln -s /opt/allure-2.27.0/bin/allure /usr/bin/allure
          allure --version

      # 3. Запуск вашего веерного скрипта (Checkstyle + API + 3 Browsers + Allure)
      # Теперь проверка 'command -v allure' внутри вашего bash-скрипта успешно сработает!
      - name: Run Parallel Tests and Generate Report
        run: |
          chmod +x run-tests.sh
          ./run-tests.sh

      # 4. Сохранение чистого HTML Allure отчета в артефакты GitHub Actions
      # Указываем путь до папки allure-report, чтобы внутри ZIP лежал готовый сайт отчета
      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-artifact
          path: test-output/*/allure-report/
          retention-days: 7

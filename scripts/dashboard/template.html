<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Automation Health Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #9aa8bc;
      --accent: #3d8bfd;
      --ok: #3ecf8e;
      --warn: #f0b429;
      --bad: #f07178;
      --border: #2a3648;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #0f1419 0%, #152033 50%, #0f1419 100%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 2rem 2rem 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    header h1 {
      margin: 0 0 0.35rem;
      font-size: 1.75rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
    .links { margin-top: 1rem; display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .links a {
      color: var(--accent);
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--panel);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .links a:hover { border-color: var(--accent); }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem 3rem;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin: 1.5rem 0;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem 1.2rem;
    }
    .card .label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .card .value { font-size: 1.85rem; font-weight: 700; margin: 0.35rem 0 0.15rem; }
    .card .hint { color: var(--muted); font-size: 0.8rem; }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
    .charts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .chart-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.2rem 1.4rem;
    }
    .chart-panel h2 {
      margin: 0 0 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      color: var(--muted);
    }
    canvas { max-height: 280px; }
    footer {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem 2rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Automation Health Dashboard</h1>
    <p id="subtitle">Loading…</p>
    <div class="links">
      <a href="./allure/">Allure Report</a>
      <a href="./swagger-coverage/">Swagger API Coverage</a>
      <a href="./data/metrics.json">metrics.json</a>
    </div>
  </header>
  <main>
    <section class="cards" id="cards"></section>
    <section class="charts">
      <div class="chart-panel">
        <h2>Automation growth (unique tests in git)</h2>
        <canvas id="growthChart"></canvas>
      </div>
      <div class="chart-panel">
        <h2>Last run executions by suite</h2>
        <canvas id="suiteChart"></canvas>
      </div>
    </section>
  </main>
  <footer id="footer"></footer>
  <script>
    const METRICS = __METRICS_JSON__;

    function pctClass(v) {
      if (v == null) return "";
      if (v >= 90) return "ok";
      if (v >= 70) return "warn";
      return "bad";
    }

    function card(label, value, hint, cls) {
      return `<article class="card"><div class="label">${label}</div>`
        + `<div class="value ${cls || ""}">${value}</div>`
        + `<div class="hint">${hint || ""}</div></article>`;
    }

    const m = METRICS;
    const run = m.run || {};
    const exec = m.executions || {};
    const suites = m.suites || {};
    const git = m.git || {};
    const swagger = m.swagger || {};
    const history = m.history || [];

    document.getElementById("subtitle").textContent =
      `Build #${run.number || "—"} · ${run.date || "—"} · branch ${run.branch || "—"}`;

    const passRate = exec.pass_rate != null ? `${exec.pass_rate.toFixed(1)}%` : "—";
    const swaggerPct = swagger.coverage_percent != null ? `${swagger.coverage_percent.toFixed(1)}%` : "—";

    document.getElementById("cards").innerHTML = [
      card("Pass rate", passRate, "Last completed run", pctClass(exec.pass_rate)),
      card("Executions", exec.total ?? "—", `${exec.passed ?? 0} passed · ${exec.failed ?? 0} failed · ${exec.broken ?? 0} broken · ${exec.skipped ?? 0} skipped`),
      card("Unique tests", exec.unique_scenarios ?? "—", "Deduped scenarios (not browser matrix)"),
      card("Tests in git", git.total_tests ?? "—", `+${git.new_tests_7d ?? 0} / 7d · +${git.new_tests_30d ?? 0} / 30d`),
      card("Avg duration", exec.avg_duration_sec != null ? `${exec.avg_duration_sec.toFixed(1)}s` : "—", "Per execution"),
      card("API coverage", swaggerPct, `${swagger.covered_operations ?? 0} / ${swagger.all_operations ?? 0} operations`, pctClass(swagger.coverage_percent)),
      card("API suite", suites.api?.total ?? "—", `${suites.api?.passed ?? 0} passed`),
      card("UI Chrome", suites["ui-chrome"]?.total ?? "—", `${suites["ui-chrome"]?.passed ?? 0} passed`),
      card("UI Firefox", suites["ui-firefox"]?.total ?? "—", `${suites["ui-firefox"]?.passed ?? 0} passed`),
    ].join("");

    document.getElementById("footer").textContent =
      `Generated ${m.generated_at || ""} · commit ${(run.commit || "").slice(0, 7)}`;

    const histLabels = history.map(h => `#${h.run_number}`);
    const histTests = history.map(h => h.git_total_tests);
    const histPass = history.map(h => h.pass_rate);

    new Chart(document.getElementById("growthChart"), {
      type: "line",
      data: {
        labels: histLabels,
        datasets: [
          {
            label: "Tests in git",
            data: histTests,
            borderColor: "#3d8bfd",
            backgroundColor: "rgba(61,139,253,0.15)",
            tension: 0.25,
            yAxisID: "y",
          },
          {
            label: "Pass rate %",
            data: histPass,
            borderColor: "#3ecf8e",
            backgroundColor: "transparent",
            tension: 0.25,
            yAxisID: "y1",
          },
        ],
      },
      options: {
        responsive: true,
        scales: {
          y: { beginAtZero: true, ticks: { color: "#9aa8bc" }, grid: { color: "#2a3648" } },
          y1: { position: "right", min: 0, max: 100, ticks: { color: "#9aa8bc" }, grid: { drawOnChartArea: false } },
          x: { ticks: { color: "#9aa8bc" }, grid: { color: "#2a3648" } },
        },
        plugins: { legend: { labels: { color: "#e7ecf3" } } },
      },
    });

    const suiteNames = ["api", "ui-chrome", "ui-firefox"];
    new Chart(document.getElementById("suiteChart"), {
      type: "bar",
      data: {
        labels: suiteNames,
        datasets: [
          {
            label: "Passed",
            data: suiteNames.map(s => (suites[s] || {}).passed || 0),
            backgroundColor: "#3ecf8e",
          },
          {
            label: "Failed / broken",
            data: suiteNames.map(s => ((suites[s] || {}).failed || 0) + ((suites[s] || {}).broken || 0)),
            backgroundColor: "#f07178",
          },
          {
            label: "Skipped",
            data: suiteNames.map(s => (suites[s] || {}).skipped || 0),
            backgroundColor: "#f0b429",
          },
        ],
      },
      options: {
        responsive: true,
        scales: {
          x: { stacked: true, ticks: { color: "#9aa8bc" }, grid: { color: "#2a3648" } },
          y: { stacked: true, beginAtZero: true, ticks: { color: "#9aa8bc" }, grid: { color: "#2a3648" } },
        },
        plugins: { legend: { labels: { color: "#e7ecf3" } } },
      },
    });
  </script>
</body>
</html>

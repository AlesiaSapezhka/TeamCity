<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Automation Health Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #9aa8bc;
      --accent: #3d8bfd;
      --ok: #3ecf8e;
      --warn: #f0b429;
      --bad: #f07178;
      --border: #2a3648;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #0f1419 0%, #152033 50%, #0f1419 100%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 2rem 2rem 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    header h1 {
      margin: 0 0 0.35rem;
      font-size: 1.75rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
    .links { margin-top: 1rem; display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .links a {
      color: var(--accent);
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--panel);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .links a:hover { border-color: var(--accent); }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem 3rem;
    }
    h2.section {
      margin: 1.75rem 0 0.75rem;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin: 0.5rem 0 0;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem 1.2rem;
    }
    .card .label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .card .value { font-size: 1.85rem; font-weight: 700; margin: 0.35rem 0 0.15rem; }
    .card .hint { color: var(--muted); font-size: 0.8rem; }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
    .charts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .chart-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.2rem 1.4rem;
    }
    .chart-panel h2 {
      margin: 0 0 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      color: var(--muted);
    }
    canvas { max-height: 280px; }
    footer {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem 2rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Automation Health Dashboard</h1>
    <p id="subtitle">Loading…</p>
    <div class="links">
      <a href="./allure/">Allure Report</a>
      <a href="./swagger-coverage/">Swagger API Coverage</a>
      <a href="./data/metrics.json">metrics.json</a>
    </div>
  </header>
  <main>
    <h2 class="section">Last run</h2>
    <section class="cards" id="cardsRun"></section>

    <h2 class="section">Duration</h2>
    <section class="cards" id="cardsDuration"></section>

    <h2 class="section">Automation size</h2>
    <section class="cards" id="cardsSize"></section>

    <section class="charts">
      <div class="chart-panel">
        <h2>Automation growth (tests in git)</h2>
        <canvas id="growthChart"></canvas>
      </div>
      <div class="chart-panel">
        <h2>Last run executions by suite</h2>
        <canvas id="suiteChart"></canvas>
      </div>
    </section>
  </main>
  <footer id="footer"></footer>
  <script>
    const METRICS = __METRICS_JSON__;

    function pctClass(v) {
      if (v == null) return "";
      if (v >= 90) return "ok";
      if (v >= 70) return "warn";
      return "bad";
    }

    function formatDuration(sec) {
      if (sec == null || Number.isNaN(sec)) return "—";
      if (sec < 60) return `${sec.toFixed(1)}s`;
      const m = Math.floor(sec / 60);
      const s = Math.round(sec % 60);
      return `${m}m ${s}s`;
    }

    function card(label, value, hint, cls) {
      return `<article class="card"><div class="label">${label}</div>`
        + `<div class="value ${cls || ""}">${value}</div>`
        + `<div class="hint">${hint || ""}</div></article>`;
    }

    function niceScale(values, padRatio = 0.35) {
      const nums = values.filter(v => typeof v === "number" && !Number.isNaN(v));
      if (!nums.length) return { min: 0, max: 10 };
      let min = Math.min(...nums);
      let max = Math.max(...nums);
      if (min === max) {
        const pad = Math.max(2, Math.abs(min) * padRatio || 2);
        return { min: Math.max(0, min - pad), max: max + pad };
      }
      const span = max - min;
      const pad = Math.max(span * padRatio, 1);
      return {
        min: Math.max(0, Math.floor(min - pad)),
        max: Math.ceil(max + pad),
      };
    }

    const m = METRICS;
    const run = m.run || {};
    const exec = m.executions || {};
    const suites = m.suites || {};
    const git = m.git || {};
    const swagger = m.swagger || {};
    const history = m.history || [];

    document.getElementById("subtitle").textContent =
      `Build #${run.number || "—"} · ${run.date || "—"} · branch ${run.branch || "—"}`;

    const passRate = exec.pass_rate != null ? `${exec.pass_rate.toFixed(1)}%` : "—";
    const swaggerPct = swagger.coverage_percent != null ? `${swagger.coverage_percent.toFixed(1)}%` : "—";
    const new7 = git.new_tests_7d ?? 0;
    const new30 = git.new_tests_30d ?? 0;

    document.getElementById("cardsRun").innerHTML = [
      card("Pass rate", passRate, "Last completed run", pctClass(exec.pass_rate)),
      card("Executions", exec.total ?? "—", `${exec.passed ?? 0} passed · ${exec.failed ?? 0} failed · ${exec.broken ?? 0} broken · ${exec.skipped ?? 0} skipped`),
      card("Unique scenarios", exec.unique_scenarios ?? "—", "Deduped across browser matrix"),
      card("API suite", suites.api?.total ?? "—", `${suites.api?.passed ?? 0} passed`),
      card("UI Chrome", suites["ui-chrome"]?.total ?? "—", `${suites["ui-chrome"]?.passed ?? 0} passed`),
      card("UI Firefox", suites["ui-firefox"]?.total ?? "—", `${suites["ui-firefox"]?.passed ?? 0} passed`),
      card("API coverage", swaggerPct, `${swagger.covered_operations ?? 0} / ${swagger.all_operations ?? 0} operations`, pctClass(swagger.coverage_percent)),
    ].join("");

    document.getElementById("cardsDuration").innerHTML = [
      card("API duration", formatDuration(exec.api_duration_sec), "Sum of API test times"),
      card("UI duration", formatDuration(exec.ui_duration_sec), "Wall time ≈ slower of Chrome/Firefox (parallel)"),
      card("UI Chrome", formatDuration(exec.ui_chrome_duration_sec), "Sum of Chrome UI tests"),
      card("UI Firefox", formatDuration(exec.ui_firefox_duration_sec), "Sum of Firefox UI tests"),
      card("Avg per test", formatDuration(exec.avg_duration_sec), "Mean execution duration"),
      card("Est. full run", formatDuration(exec.total_duration_sec), "API + UI wall (matrix parallel)"),
    ].join("");

    document.getElementById("cardsSize").innerHTML = [
      card("Tests in git", git.total_tests ?? "—", `API ${git.api_tests ?? 0} · UI ${git.ui_tests ?? 0}`),
      card("New (7 days)", new7 > 0 ? `+${new7}` : "0", "Net @Test added in git diffs"),
      card("New (30 days)", new30 > 0 ? `+${new30}` : "0", "Net @Test added in git diffs"),
    ].join("");

    document.getElementById("footer").textContent =
      `Generated ${m.generated_at || ""} · commit ${(run.commit || "").slice(0, 7)}`;

    const histLabels = history.map(h => `#${h.run_number}`);
    const histTests = history.map(h => h.git_total_tests);
    const histPass = history.map(h => h.pass_rate);
    const testsScale = niceScale(histTests);

    new Chart(document.getElementById("growthChart"), {
      type: "line",
      data: {
        labels: histLabels,
        datasets: [
          {
            label: "Tests in git",
            data: histTests,
            borderColor: "#3d8bfd",
            backgroundColor: "rgba(61,139,253,0.15)",
            tension: 0.25,
            yAxisID: "y",
          },
          {
            label: "Pass rate %",
            data: histPass,
            borderColor: "#3ecf8e",
            backgroundColor: "transparent",
            tension: 0.25,
            yAxisID: "y1",
          },
        ],
      },
      options: {
        responsive: true,
        scales: {
          y: {
            min: testsScale.min,
            max: testsScale.max,
            ticks: { color: "#9aa8bc", precision: 0 },
            grid: { color: "#2a3648" },
            title: { display: true, text: "Tests in git", color: "#9aa8bc" },
          },
          y1: {
            position: "right",
            min: 70,
            max: 100,
            ticks: { color: "#9aa8bc" },
            grid: { drawOnChartArea: false },
            title: { display: true, text: "Pass rate %", color: "#9aa8bc" },
          },
          x: { ticks: { color: "#9aa8bc" }, grid: { color: "#2a3648" } },
        },
        plugins: { legend: { labels: { color: "#e7ecf3" } } },
      },
    });

    const suiteNames = ["api", "ui-chrome", "ui-firefox"];
    new Chart(document.getElementById("suiteChart"), {
      type: "bar",
      data: {
        labels: suiteNames,
        datasets: [
          {
            label: "Passed",
            data: suiteNames.map(s => (suites[s] || {}).passed || 0),
            backgroundColor: "#3ecf8e",
          },
          {
            label: "Failed / broken",
            data: suiteNames.map(s => ((suites[s] || {}).failed || 0) + ((suites[s] || {}).broken || 0)),
            backgroundColor: "#f07178",
          },
          {
            label: "Skipped",
            data: suiteNames.map(s => (suites[s] || {}).skipped || 0),
            backgroundColor: "#f0b429",
          },
        ],
      },
      options: {
        responsive: true,
        scales: {
          x: { stacked: true, ticks: { color: "#9aa8bc" }, grid: { color: "#2a3648" } },
          y: { stacked: true, beginAtZero: true, ticks: { color: "#9aa8bc" }, grid: { color: "#2a3648" } },
        },
        plugins: { legend: { labels: { color: "#e7ecf3" } } },
      },
    });
  </script>
</body>
</html>
